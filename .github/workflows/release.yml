name: Build WordPress release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Package and publish plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches plugin version
        shell: bash
        run: |
          set -euo pipefail

          plugin_version="$(sed -n 's/^ \* Version:[[:space:]]*//p' octave-addons/octave-addons.php | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$plugin_version" != "$tag_version" ]]; then
              echo "Plugin version $plugin_version does not match tag $GITHUB_REF_NAME."
              exit 1
          fi

      - name: Build WordPress installation ZIP
        shell: bash
        run: |
          set -euo pipefail

          plugin_version="${GITHUB_REF_NAME#v}"
          versioned_package="octave-addons_${plugin_version}.zip"

          git archive \
              --format=zip \
              --prefix=octave-addons/ \
              --output="$versioned_package" \
              HEAD:octave-addons

          cp "$versioned_package" octave-addons.zip

      - name: Verify package structure
        shell: bash
        run: |
          set -euo pipefail

          plugin_version="${GITHUB_REF_NAME#v}"
          versioned_package="octave-addons_${plugin_version}.zip"

          for package in "$versioned_package" octave-addons.zip; do
              unzip -t "$package"
              unzip -Z1 "$package" | awk -F/ 'NF { print $1 }' | sort -u | grep -qx 'octave-addons'
              unzip -Z1 "$package" | awk '$0 == "octave-addons/octave-addons.php" { found = 1 } END { exit ! found }'
              unzip -Z1 "$package" | awk '/^octave-addons\/(\.git|\.github)\// || /^octave-addons\/\.gitattributes$/ || /\/\.DS_Store$/ { forbidden = 1 } END { exit forbidden }'
          done

          cmp -s "$versioned_package" octave-addons.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          plugin_version="${GITHUB_REF_NAME#v}"
          versioned_package="octave-addons_${plugin_version}.zip"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "$versioned_package" octave-addons.zip --clobber
          else
              gh release create "$GITHUB_REF_NAME" "$versioned_package" octave-addons.zip --generate-notes --title "$GITHUB_REF_NAME"
          fi
