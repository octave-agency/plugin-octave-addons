name: Build WordPress release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Package and publish plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and verify plugin version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          plugin_version="$(sed -n 's/^ \* Version:[[:space:]]*//p' octave-addons/octave-addons.php | head -n 1)"
          stable_tag="$(sed -n 's/^Stable tag:[[:space:]]*//p' octave-addons/readme.txt | head -n 1)"
          release_tag="v${plugin_version}"

          if [[ ! "$plugin_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Plugin version $plugin_version is not valid semantic versioning."
              exit 1
          fi

          if [[ "$plugin_version" != "$stable_tag" ]]; then
              echo "Plugin version $plugin_version does not match stable tag $stable_tag."
              exit 1
          fi

          echo "plugin_version=$plugin_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          if gh release view "$release_tag" >/dev/null 2>&1; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Release $release_tag already exists; nothing to publish."
          else
              echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build WordPress installation ZIP
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          PLUGIN_VERSION: ${{ steps.release.outputs.plugin_version }}
        run: |
          set -euo pipefail

          versioned_package="octave-addons_${PLUGIN_VERSION}.zip"

          git archive \
              --format=zip \
              --prefix=octave-addons/ \
              --output="$versioned_package" \
              HEAD:octave-addons

          cp "$versioned_package" octave-addons.zip

      - name: Verify package structure
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          PLUGIN_VERSION: ${{ steps.release.outputs.plugin_version }}
        run: |
          set -euo pipefail

          versioned_package="octave-addons_${PLUGIN_VERSION}.zip"

          for package in "$versioned_package" octave-addons.zip; do
              unzip -t "$package"
              unzip -Z1 "$package" | awk -F/ 'NF { print $1 }' | sort -u | grep -qx 'octave-addons'
              unzip -Z1 "$package" | awk '$0 == "octave-addons/octave-addons.php" { found = 1 } END { exit ! found }'
              unzip -Z1 "$package" | awk '/^octave-addons\/(\.git|\.github)\// || /^octave-addons\/\.gitattributes$/ || /\/\.DS_Store$/ { forbidden = 1 } END { exit forbidden }'
          done

          cmp -s "$versioned_package" octave-addons.zip

      - name: Create GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ steps.release.outputs.plugin_version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          versioned_package="octave-addons_${PLUGIN_VERSION}.zip"

          gh release create "$RELEASE_TAG" \
              "$versioned_package" \
              octave-addons.zip \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG"
